<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>동호회 협찬물품 관리</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts (Pretendard / Noto Sans KR) -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #f8fafc;
      -webkit-tap-highlight-color: transparent;
    }
    /* 로딩 스피너 애니메이션 */
    .loader {
      border: 3px solid #e2e8f0;
      border-top: 3px solid #2563eb;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="text-slate-800 pb-24">

  <!-- 상단 네비게이션 바 -->
  <header class="sticky top-0 z-30 bg-white border-b border-slate-200 shadow-sm">
    <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="bg-blue-600 text-white p-2 rounded-lg font-bold text-sm">백스모</span>
        <h1 class="text-lg sm:text-xl font-bold text-slate-900">협찬물품 관리대장</h1>
      </div>
      <!-- PC용 물품 추가 버튼 -->
      <button onclick="openModal()" class="hidden sm:flex items-center gap-1.5 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-semibold transition shadow-sm">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
        새 물품 등록
      </button>
    </div>
  </header>

  <!-- 메인 컨테이너 -->
  <main class="max-w-5xl mx-auto px-4 pt-5">
    
    <!-- 요약 대시보드 카드 -->
    <section class="grid grid-cols-3 gap-3 mb-5">
      <div class="bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm text-center">
        <p class="text-xs text-slate-500 font-medium">전체 품목</p>
        <p id="statTotalItems" class="text-xl sm:text-2xl font-bold text-slate-900 mt-1">0</p>
      </div>
      <div class="bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm text-center">
        <p class="text-xs text-slate-500 font-medium">보관중 수량</p>
        <p id="statInStock" class="text-xl sm:text-2xl font-bold text-blue-600 mt-1">0</p>
      </div>
      <div class="bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm text-center">
        <p class="text-xs text-slate-500 font-medium">지급/소진</p>
        <p id="statUsed" class="text-xl sm:text-2xl font-bold text-emerald-600 mt-1">0</p>
      </div>
    </section>

    <!-- 검색 및 필터 영역 -->
    <section class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm mb-6 space-y-3">
      <!-- 검색창 -->
      <div class="relative">
        <input type="text" id="searchInput" oninput="filterItems()" placeholder="물품명, 협찬자 또는 메모 내용으로 검색..." 
          class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition">
        <svg class="w-4 h-4 text-slate-400 absolute left-3.5 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
      </div>

      <!-- 카테고리 & 상태 필터 -->
      <div class="grid grid-cols-2 gap-2.5">
        <select id="categoryFilter" onchange="filterItems()" class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="ALL">전체 카테고리</option>
          <option value="골프용품">골프용품</option>
          <option value="음료/간식">음료/간식</option>
          <option value="스포츠용품">스포츠용품</option>
          <option value="의류/잡화">의류/잡화</option>
          <option value="전자기기">전자기기</option>
          <option value="상품권/쿠폰">상품권/쿠폰</option>
          <option value="현금">현금</option>
          <option value="기타">기타</option>
        </select>

        <select id="statusFilter" onchange="filterItems()" class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="ALL">전체 상태</option>
          <option value="보관중">보관중</option>
          <option value="지급완료">지급완료</option>
          <option value="소진됨">소진됨</option>
        </select>
      </div>
    </section>

    <!-- 물품 목록 그리드 -->
    <section id="itemsContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
      <!-- 자바스크립트로 카드가 동적 생성됩니다 -->
    </section>

    <!-- 데이터 없음 안내 -->
    <div id="emptyState" class="hidden text-center py-16 bg-white rounded-xl border border-slate-200">
      <p class="text-slate-400 text-base">조건에 맞는 협찬 물품이 없습니다.</p>
      <button onclick="openModal()" class="mt-3 text-blue-600 text-sm font-semibold hover:underline">+ 첫 물품 등록하기</button>
    </div>

  </main>

  <!-- 모바일 전용 하단 플로팅 추가 버튼 -->
  <button onclick="openModal()" class="sm:hidden fixed bottom-6 right-6 z-30 bg-blue-600 hover:bg-blue-700 text-white w-14 h-14 rounded-full shadow-lg flex items-center justify-center transition active:scale-95">
    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path></svg>
  </button>

  <!-- 등록 / 수정 모달 창 -->
  <div id="itemModal" class="fixed inset-0 z-40 hidden bg-slate-900/60 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl shadow-xl overflow-hidden max-h-[90vh] flex flex-col">
      
      <!-- 모달 헤더 -->
      <div class="px-5 py-4 border-b border-slate-200 flex items-center justify-between">
        <h2 id="modalTitle" class="text-lg font-bold text-slate-900">새 협찬 물품 등록</h2>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-1">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>

      <!-- 모달 폼 영역 (스크롤 가능) -->
      <form id="itemForm" onsubmit="handleFormSubmit(event)" class="p-5 space-y-4 overflow-y-auto">
        <input type="hidden" id="itemId">
        <input type="hidden" id="existingImageUrl">

        <!-- 이미지 업로드 및 미리보기 -->
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1.5">물품 사진 (선택)</label>
          <div class="flex items-center gap-4">
            <div id="imagePreviewBox" class="w-20 h-20 rounded-xl bg-slate-100 border border-dashed border-slate-300 flex items-center justify-center overflow-hidden shrink-0">
              <img id="imagePreview" src="" class="hidden w-full h-full object-cover">
              <span id="imagePlaceholder" class="text-xs text-slate-400 text-center px-1">사진 없음</span>
            </div>
            <div class="flex-1">
              <input type="file" id="imageInput" accept="image/*" onchange="handleImageSelect(event)" 
                class="block w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer">
              <p class="text-[11px] text-slate-400 mt-1">모바일 카메라 촬영 또는 앨범 선택 가능</p>
            </div>
          </div>
        </div>

        <!-- 물품명 -->
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">물품명 <span class="text-red-500">*</span></label>
          <input type="text" id="itemName" required placeholder="예: 포카리스웨트 500ml 1박스" 
            class="w-full px-3.5 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <!-- 카테고리 & 수량 -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">카테고리 <span class="text-red-500">*</span></label>
            <select id="itemCategory" required class="w-full px-3 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="골프용품">골프용품</option>
              <option value="음료/간식">음료/간식</option>
              <option value="스포츠용품">스포츠용품</option>
              <option value="의류/잡화">의류/잡화</option>
              <option value="전자기기">전자기기</option>
              <option value="상품권/쿠폰">상품권/쿠폰</option>
              <option value="현금">현금</option>
              <option value="기타">기타</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">수량 <span class="text-red-500">*</span></label>
            <input type="number" id="itemQuantity" required min="0" value="1" 
              class="w-full px-3.5 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
        </div>

        <!-- 협찬자 & 상태 -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">협찬자 (회원/업체) <span class="text-red-500">*</span></label>
            <input type="text" id="itemSponsor" required placeholder="예: 김철수 회원" 
              class="w-full px-3.5 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">보관 상태 <span class="text-red-500">*</span></label>
            <select id="itemStatus" required class="w-full px-3 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="보관중">보관중</option>
              <option value="지급완료">지급완료</option>
              <option value="소진됨">소진됨</option>
            </select>
          </div>
        </div>

        <!-- 메모 (선택) -->
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">메모 (선택)</label>
          <textarea id="itemMemo" rows="2" placeholder="예: 11월 월례회 롱기스트 시상품, 총무 트렁크 보관 등" 
            class="w-full px-3.5 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"></textarea>
        </div>

        <!-- 저장 버튼 -->
        <div class="pt-2 flex gap-2">
          <button type="button" onclick="closeModal()" class="w-1/3 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-sm font-semibold transition">취소</button>
          <button type="submit" id="submitBtn" class="w-2/3 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-semibold transition shadow-sm">저장하기</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 커스텀 삭제 확인 모달 창 (confirm() 대체) -->
  <div id="confirmModal" class="fixed inset-0 z-50 hidden bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-2xl shadow-xl overflow-hidden animate-[fadeIn_0.15s_ease-out]">
      <div class="p-6 text-center">
        <div class="w-12 h-12 rounded-full bg-red-100 text-red-600 flex items-center justify-center mx-auto mb-3.5">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
          </svg>
        </div>
        <h3 class="text-base font-bold text-slate-900">협찬 물품 삭제</h3>
        <p id="confirmMessage" class="text-sm text-slate-600 mt-2 leading-relaxed break-keep">
          선택한 물품을 정말 삭제하시겠습니까?
        </p>
        <p class="text-xs text-red-500 mt-1.5 font-medium">삭제된 데이터는 복구할 수 없습니다.</p>
      </div>
      <div class="px-5 py-3.5 bg-slate-50 border-t border-slate-100 flex gap-2.5">
        <button type="button" onclick="closeConfirmModal()" class="w-1/2 py-2.5 bg-white border border-slate-300 hover:bg-slate-100 text-slate-700 rounded-xl text-sm font-semibold transition">
          취소
        </button>
        <button type="button" id="confirmDeleteBtn" class="w-1/2 py-2.5 bg-red-600 hover:bg-red-700 text-white rounded-xl text-sm font-semibold transition shadow-sm">
          삭제하기
        </button>
      </div>
    </div>
  </div>

  <!-- 커스텀 알림(Alert) 모달 창 -->
  <div id="alertModal" class="fixed inset-0 z-50 hidden bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-xs rounded-2xl shadow-xl overflow-hidden text-center">
      <div class="p-5">
        <div class="w-10 h-10 rounded-full bg-amber-100 text-amber-600 flex items-center justify-center mx-auto mb-3">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
          </svg>
        </div>
        <h3 id="alertTitle" class="text-base font-bold text-slate-900">안내</h3>
        <p id="alertMessage" class="text-xs text-slate-600 mt-1.5 leading-relaxed break-words"></p>
      </div>
      <div class="px-5 py-3 bg-slate-50 border-t border-slate-100">
        <button type="button" onclick="closeAlertModal()" class="w-full py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-sm font-semibold transition">
          확인
        </button>
      </div>
    </div>
  </div>

  <!-- 전체 화면 로딩 오버레이 -->
  <div id="loadingOverlay" class="fixed inset-0 z-50 bg-white/80 backdrop-blur-xs flex flex-col items-center justify-center">
    <div class="loader mb-3"></div>
    <p id="loadingText" class="text-sm font-semibold text-slate-700">데이터를 불러오는 중...</p>
  </div>

  <script>
    // 전역 상태 변수
    let allItems = [];
    let processedImage = null; // 압축된 Base64 이미지 데이터 저장
    let pendingDeleteId = null;

    // 페이지 로드 시 초기 데이터 조회
    window.onload = function() {
      fetchItems();
    };

    /**
     * HTML 이스케이프 처리 유틸리티 (XSS 및 따옴표 깨짐 방지)
     */
    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    /**
     * 커스텀 알림 모달 열기/닫기
     */
    function showAlert(message, title = '알림') {
      document.getElementById('alertTitle').innerText = title;
      document.getElementById('alertMessage').innerText = message;
      document.getElementById('alertModal').classList.remove('hidden');
    }

    function closeAlertModal() {
      document.getElementById('alertModal').classList.add('hidden');
    }

    /**
     * 로딩 오버레이 표시/숨김 제어
     */
    function setLoading(isLoading, text = '처리 중입니다...') {
      const overlay = document.getElementById('loadingOverlay');
      document.getElementById('loadingText').innerText = text;
      if (isLoading) overlay.classList.remove('hidden');
      else overlay.classList.add('hidden');
    }

    /**
     * 1. 백엔드(Code.gs)에서 전체 물품 목록 가져오기
     */
    function fetchItems() {
      setLoading(true, '협찬물품 목록을 불러오는 중...');
      google.script.run
        .withSuccessHandler(function(res) {
          setLoading(false);
          if (res.success) {
            allItems = res.data;
            updateDashboard();
            filterItems();
          } else {
            showAlert('데이터 조회 실패: ' + res.message, '오류');
          }
        })
        .withFailureHandler(function(err) {
          setLoading(false);
          showAlert('서버 통신 오류: ' + err, '오류');
        })
        .getItems();
    }

    /**
     * 상단 통계 대시보드 업데이트
     */
    function updateDashboard() {
      const total = allItems.length;
      const inStockQty = allItems
        .filter(item => item.status === '보관중')
        .reduce((sum, item) => sum + Number(item.quantity), 0);
      const usedCount = allItems.filter(item => item.status !== '보관중').length;

      document.getElementById('statTotalItems').innerText = total + '종';
      document.getElementById('statInStock').innerText = inStockQty + '개';
      document.getElementById('statUsed').innerText = usedCount + '건';
    }

    /**
     * 검색어 및 필터 조건에 따라 화면 렌더링
     */
    function filterItems() {
      const keyword = document.getElementById('searchInput').value.toLowerCase().trim();
      const category = document.getElementById('categoryFilter').value;
      const status = document.getElementById('statusFilter').value;

      const filtered = allItems.filter(item => {
        const matchKeyword = item.name.toLowerCase().includes(keyword) || 
                             item.sponsor.toLowerCase().includes(keyword) ||
                             (item.memo && item.memo.toLowerCase().includes(keyword));
        const matchCategory = (category === 'ALL') || (item.category === category);
        const matchStatus = (status === 'ALL') || (item.status === status);
        return matchKeyword && matchCategory && matchStatus;
      });

      renderItems(filtered);
    }

    /**
     * 물품 카드 리스트 HTML 렌더링 (메모 항목 포함)
     */
    function renderItems(items) {
      const container = document.getElementById('itemsContainer');
      const emptyState = document.getElementById('emptyState');
      container.innerHTML = '';

      if (items.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      }
      emptyState.classList.add('hidden');

      items.forEach(item => {
        // 상태별 뱃지 색상 지정
        let statusBadge = 'bg-blue-100 text-blue-700';
        if (item.status === '지급완료') statusBadge = 'bg-emerald-100 text-emerald-700';
        else if (item.status === '소진됨') statusBadge = 'bg-slate-200 text-slate-600';

        // 이미지가 없을 경우 기본 플레이스홀더 아이콘 출력
        const imageHtml = item.imageUrl 
          ? `<img src="${item.imageUrl}" alt="${escapeHtml(item.name)}" class="w-full h-44 object-cover bg-slate-100" onerror="this.src='https://placehold.co/400x300/e2e8f0/64748b?text=No+Image'">`
          : `<div class="w-full h-44 bg-slate-100 flex flex-col items-center justify-center text-slate-400">
               <svg class="w-10 h-10 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
               <span class="text-xs">등록된 사진 없음</span>
             </div>`;

        // 메모 영역 HTML (값이 있으면 내용 출력, 없으면 '-' 표시)
        const hasMemo = item.memo && String(item.memo).trim() !== '';
        const memoHtml = hasMemo
          ? `<div class="mt-2.5 pt-2.5 border-t border-slate-100">
               <div class="flex items-start gap-1.5 bg-amber-50/80 border border-amber-100 rounded-lg p-2.5 text-xs text-slate-700">
                 <svg class="w-3.5 h-3.5 text-amber-500 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                   <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                 </svg>
                 <p class="whitespace-pre-line break-words leading-relaxed"><span class="font-semibold text-amber-900">메모:</span> ${escapeHtml(item.memo)}</p>
               </div>
             </div>`
          : `<p><span class="font-medium text-slate-700">메모:</span> <span class="text-slate-400">-</span></p>`;

        const card = document.createElement('div');
        card.className = 'bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden flex flex-col justify-between hover:shadow-md transition';
        card.innerHTML = `
          <div>
            <div class="relative">
              ${imageHtml}
              <span class="absolute top-2.5 left-2.5 px-2.5 py-1 rounded-md text-xs font-bold ${statusBadge} shadow-xs">
                ${escapeHtml(item.status)}
              </span>
              <span class="absolute top-2.5 right-2.5 px-2 py-1 rounded-md text-xs font-medium bg-slate-900/70 text-white">
                ${escapeHtml(item.category)}
              </span>
            </div>
            <div class="p-4">
              <div class="flex justify-between items-start gap-2">
                <h3 class="font-bold text-base text-slate-900 line-clamp-1">${escapeHtml(item.name)}</h3>
                <span class="shrink-0 text-sm font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded">수량: ${item.quantity}</span>
              </div>
              <div class="mt-2.5 space-y-1 text-xs text-slate-500">
                <p><span class="font-medium text-slate-700">협찬자:</span> ${escapeHtml(item.sponsor)}</p>
                <p><span class="font-medium text-slate-700">등록일:</span> ${escapeHtml(item.regDate)}</p>
                ${!hasMemo ? memoHtml : ''}
              </div>
              ${hasMemo ? memoHtml : ''}
            </div>
          </div>
          
          <!-- 카드 하단 수정/삭제 버튼 -->
          <div class="px-4 py-2.5 bg-slate-50 border-t border-slate-100 flex justify-end gap-2">
            <button onclick="openEditModalById('${item.id}')" 
              class="px-3 py-1.5 text-xs font-semibold text-slate-700 bg-white border border-slate-300 rounded-lg hover:bg-slate-100 transition">
              수정
            </button>
            <button onclick="openConfirmModal('${item.id}')" 
              class="px-3 py-1.5 text-xs font-semibold text-red-600 bg-white border border-red-200 rounded-lg hover:bg-red-50 transition">
              삭제
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    /**
     * 새 물품 등록 모달 열기
     */
    function openModal() {
      document.getElementById('itemForm').reset();
      document.getElementById('itemId').value = '';
      document.getElementById('existingImageUrl').value = '';
      document.getElementById('itemMemo').value = '';
      document.getElementById('modalTitle').innerText = '새 협찬 물품 등록';
      processedImage = null;

      // 미리보기 초기화
      document.getElementById('imagePreview').classList.add('hidden');
      document.getElementById('imagePlaceholder').classList.remove('hidden');

      document.getElementById('itemModal').classList.remove('hidden');
    }

    /**
     * ID로 물품을 찾아 수정 모달 열기 (줄바꿈/특수문자 포함 메모 안전 처리)
     */
    function openEditModalById(id) {
      const item = allItems.find(i => i.id === id);
      if (!item) return;

      document.getElementById('itemForm').reset();
      document.getElementById('itemId').value = item.id;
      document.getElementById('existingImageUrl').value = item.imageUrl;
      document.getElementById('itemName').value = item.name;
      document.getElementById('itemCategory').value = item.category;
      document.getElementById('itemQuantity').value = item.quantity;
      document.getElementById('itemSponsor').value = item.sponsor;
      document.getElementById('itemStatus').value = item.status;
      document.getElementById('itemMemo').value = item.memo || '';
      document.getElementById('modalTitle').innerText = '협찬 물품 정보 수정';
      processedImage = null;

      // 기존 이미지가 있다면 미리보기에 표시
      const preview = document.getElementById('imagePreview');
      const placeholder = document.getElementById('imagePlaceholder');
      if (item.imageUrl) {
        preview.src = item.imageUrl;
        preview.classList.remove('hidden');
        placeholder.classList.add('hidden');
      } else {
        preview.classList.add('hidden');
        placeholder.classList.remove('hidden');
      }

      document.getElementById('itemModal').classList.remove('hidden');
    }

    /**
     * 등록/수정 모달 닫기
     */
    function closeModal() {
      document.getElementById('itemModal').classList.add('hidden');
    }

    /**
     * 이미지 선택 시 모바일 고화질 사진을 800px 이하로 자동 압축(리사이징) 및 미리보기 처리
     */
    function handleImageSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 800; // 최대 가로 크기 800px로 압축하여 빠른 업로드 보장
          let width = img.width;
          let height = img.height;

          if (width > MAX_WIDTH) {
            height *= MAX_WIDTH / width;
            width = MAX_WIDTH;
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          // JPEG 품질 0.8로 압축
          const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
          
          // 미리보기 업데이트
          const preview = document.getElementById('imagePreview');
          preview.src = dataUrl;
          preview.classList.remove('hidden');
          document.getElementById('imagePlaceholder').classList.add('hidden');

          // 서버 전송용 순수 Base64 데이터 추출
          processedImage = {
            base64: dataUrl.split(',')[1],
            name: 'item_' + new Date().getTime() + '.jpg',
            type: 'image/jpeg'
          };
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    /**
     * 폼 제출 (신규 추가 또는 수정 실행)
     */
    function handleFormSubmit(event) {
      event.preventDefault();

      const id = document.getElementById('itemId').value;
      const isEdit = Boolean(id);

      const formData = {
        id: id,
        name: document.getElementById('itemName').value.trim(),
        category: document.getElementById('itemCategory').value,
        quantity: document.getElementById('itemQuantity').value,
        sponsor: document.getElementById('itemSponsor').value.trim(),
        status: document.getElementById('itemStatus').value,
        memo: document.getElementById('itemMemo').value.trim(),
        existingImageUrl: document.getElementById('existingImageUrl').value,
        imageBase64: processedImage ? processedImage.base64 : null,
        imageName: processedImage ? processedImage.name : null,
        imageType: processedImage ? processedImage.type : null
      };

      closeModal();
      setLoading(true, isEdit ? '물품 정보를 수정하는 중...' : '새 물품과 사진을 등록하는 중...');

      const runner = google.script.run
        .withSuccessHandler(function(res) {
          if (res.success) {
            fetchItems(); // 목록 새로고침
          } else {
            setLoading(false);
            showAlert(res.message, '오류');
          }
        })
        .withFailureHandler(function(err) {
          setLoading(false);
          showAlert('오류가 발생했습니다: ' + err, '오류');
        });

      if (isEdit) {
        runner.updateItem(formData);
      } else {
        runner.addItem(formData);
      }
    }

    /**
     * 커스텀 삭제 확인 모달 열기
     */
    function openConfirmModal(id) {
      const item = allItems.find(i => i.id === id);
      if (!item) return;

      pendingDeleteId = id;
      const msgEl = document.getElementById('confirmMessage');
      msgEl.innerHTML = `<span class="font-bold text-slate-900">'${escapeHtml(item.name)}'</span> 물품을 정말 삭제하시겠습니까?`;
      
      document.getElementById('confirmModal').classList.remove('hidden');
    }

    /**
     * 커스텀 삭제 확인 모달 닫기
     */
    function closeConfirmModal() {
      pendingDeleteId = null;
      document.getElementById('confirmModal').classList.add('hidden');
    }

    /**
     * 커스텀 모달에서 '삭제하기' 버튼 클릭 시 실제 삭제 실행
     */
    document.getElementById('confirmDeleteBtn').addEventListener('click', function() {
      if (!pendingDeleteId) return;
      const targetId = pendingDeleteId;
      closeConfirmModal();

      setLoading(true, '물품을 삭제하는 중...');
      google.script.run
        .withSuccessHandler(function(res) {
          if (res.success) {
            fetchItems();
          } else {
            setLoading(false);
            showAlert(res.message, '삭제 오류');
          }
        })
        .withFailureHandler(function(err) {
          setLoading(false);
          showAlert('삭제 오류: ' + err, '오류');
        })
        .deleteItem(targetId);
    });
  </script>
</body>
</html>

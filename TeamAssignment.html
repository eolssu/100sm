    <script>
        // Register the plugin to all charts:
        Chart.register(ChartDataLabels);

        // 백스모 구글시트 데이터 주소
        const memberSheetUrl = "https://script.google.com/macros/s/AKfycbwn_v9sy4zdgJww4dVGofsBJBx56d4zvkfZMiO6jm8LfT-LjuVDYvTjSSBndgRgYPx3/exec";

        // 등급 우선순위 정의
        const gradeOrder = {
        '독수리골드': 1,
        '독수리실버': 2,
        '독수리브론즈': 3,
        '독수리예정' : 4,
        '매골드': 5,
        '매실버': 6,
        '매브론즈': 7,
        '매예정' : 8,
        '학골드': 9,
        '학실버': 10,
        '학브론즈': 11,
        '학예정' : 12,
        '까치골드': 13,
        '까치실버': 14,
        '까치브론즈': 15,
        '까치예정' : 16,
        '참새골드': 17,
        '참새실버': 18,
        '참새브론즈': 19,
        '참새예정' : 20
        };

        const gradeStrDic = {
            "REA1": "독수리 골드", "REA2": "독수리 실버", "REA3": "독수리 브론즈",
            "RFA1": "매 골드", "RFA2": "매 실버", "RFA3": "매 브론즈",
            "RCR1": "학 골드", "RCR2": "학 실버", "RCR3": "학 브론즈",
            "RMA1": "까치 골드", "RMA2": "까치 실버", "RMA3": "까치 브론즈",
            "RSP1": "참새 골드", "RSP2": "참새 실버", "RSP3": "참새 브론즈",
            "PSP0": "참새 예정", "PMA0": "까치 예정", "PCR0": "학 예정", 
            "PFA0": "매 예정", "PEA0": "독수리 예정"
        };

        function cvtGradeStr(grade) {
            return gradeStrDic[grade] || grade;
        }
    </script>

        /* 행운의 로또 추첨기 */
        .lotto-app {

            background: #f7f8fa;
            overflow: hidden;
            border-radius: 8px;
            border: 1px solid #ddd;

            font: inherit;
        }

            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            width: auto;
            padding: unset;
            background: unset;
            color: unset;
            border: unset;
            border-radius: unset;
            font-size: inherit;
            transition: none;
        }

        .lotto-app button:hover {
            background: unset;
        }

        .lotto-app label {
            display: unset;
            margin: 0;
            color: unset;
        }

            padding: unset;
            border: unset;
            border-radius: unset;

        }

            flex-direction: row;
            align-items: stretch;
            gap: 8px;
            padding: 10px 10px 0;
        }

            width: 100%;
            height: 100%;
            flex: none;
            border-radius: 14px;
            background: var(--lotto-navy);
            display: grid;
            place-items: center;
            position: relative;
            overflow: hidden;
        }

        #lotteryCanvas {
            display: block;
            width: calc(100% - 4px);
            max-width: 100%;
            max-height: 100%;
            height: auto;
            aspect-ratio: 1/1;
            object-fit: contain;
            border-radius: 50%;
            border: 5px solid #3b465a;
            background: #10192b;
            box-shadow: inset 0 0 24px #0009, 0 10px 25px #0005;
        }

        .lotto-stage-caption {
            position: absolute;
            bottom: 12px;
            left: 0;
            right: 0;
            text-align: center;
            color: #aeb8cb;
            font-size: 12px;
            letter-spacing: .04em;
        }

        .lotto-winner-card {
            margin-top: 0;
            flex: 1;
            min-width: 0;
            padding: 8px;
            display: flex;
            flex-direction: column;
            height: 280px;
            border: 1px solid var(--lotto-line);
            border-radius: 12px;
            background: #f7f8fa;
        }

        .lotto-list-title {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-direction: column;
            font-size: 11px;
            color: #606977;
            font-weight: 700;
            gap: 4px;
            padding-bottom: 7px;
            border-bottom: 1px solid #e6e8ed;
            margin-bottom: 7px;
        }

        .lotto-winner-list {
            display: grid;
            gap: 5px;
            flex: 1;
            min-height: 0;
            overflow: auto;
            align-content: start;
        }

        .lotto-winner {
            display: flex;
            align-items: center;
            gap: 5px;
            min-height: 36px;
            padding: 4px;
            border: 1px solid #e7e9ef;
            background: white;
            border-radius: 9px;
            font-size: 11px;
        }

        .lotto-winner-ball {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            flex: none;
            display: grid;
            place-items: center;
            color: white;
            font-size: 8px;
            font-weight: 800;
            background-size: cover;
            background-position: center;
            border: 2px solid white;
            box-shadow: 0 2px 5px #0002;
        }

        .lotto-place {
            font-weight: 650;
            color: #596273;
            white-space: nowrap;
            font-size: 10px;
        }

        .lotto-name {
            font-weight: 800;
            color: #111827;
            overflow-wrap: anywhere;
            flex: 1;
        }

        .lotto-empty {
            font-size: 11px;
            color: #8991a0;
            text-align: center;
            padding: 12px 2px;
        }

        .lotto-bottom-row {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .lotto-content {
            padding: 20px 20px calc(28px + env(safe-area-inset-bottom));
        }

        .lotto-settings {
            border: 1px solid var(--lotto-line);
            border-radius: 16px;
            padding: 13px;
            background: #f1f3f7;
        }

        .lotto-label {
            font-size: 14px;
            color: #525c6b;
            margin: 0 0 8px;
            font-weight: 650;
            display: block;
        }

            display: flex;
            padding: 3px;
            border-radius: 999px;
            background: #e2e5eb;
            margin-bottom: 14px;
        }

            flex: 1;
            border: 0;
            border-radius: 999px;
            padding: 9px 4px;
            background: transparent;
            color: #566071;
            font-size: 14px;
        }

        .lotto-segment button.active {
            background: white;
            color: #111827;
            font-weight: 750;
            box-shadow: 0 1px 4px #0000000d;
        }

        .lotto-range-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            color: #525c6b;
            margin-bottom: 4px;
        }

        .lotto-range-head strong {
            color: var(--lotto-blue);
        }

    <script>
        // ... 기존 스크립트 코드 유지 ...
        // 참가자 목록을 저장할 Set (중복 방지)
        const participants = new Set();
        let isFetching = false;  // 가져오기 진행 중 여부를 추적하는 변수
		let lottoNames = "";

        function getNickImgByUsrNo(userNo, type = "N") {
            if (!userNo) return;
            const userNoStr = userNo.toString();
            const suffix = "_" + type;
            const folder = parseInt(userNoStr.slice(userNoStr.length - 2, userNoStr.length), 10);
            return `https://i.gzcdn.net/nickimage/${folder}/${userNoStr}${suffix}.jpg?dummy=${new Date().getTime()}`;
        }

        async function fetchGolfzonUserData(userNo) {
            try {
                const response = await fetch(`https://lobby.golfzon.com/v1/nasmo/profile/${userNo}`);
                const data = await response.json();
                if (!data) {
                    return { ghandy: null, nickName: null, gradeName: null };
                } else {
                    return { 
                        ghandy: data.ghandy, 
                        nickName: data.userNickname,
                        gradeName: data.gradeName || '-'
                    };
                }
            } catch (error) {
                console.error('Error fetching ghandy:', error);
                return null;
            }
        }

        function updateParticipantCount() {
            const countElement = document.getElementById('participantCount');
            countElement.textContent = participants.size;
        }

        function addParticipant(nickname, gradeName, ghandy, userNo) {
            if (participants.has(userNo)) {
                alert('이미 참가 목록에 있는 사용자입니다.');
                return;
            }

            participants.add(userNo);
            const tbody = document.getElementById('participantsBody');
            const row = document.createElement('tr');
            row.setAttribute('data-user-no', userNo);
            
            row.innerHTML = `
                <td>
                    <div class="player-info">
                        <img 
                            src="${getNickImgByUsrNo(userNo)}" 
                            class="player-image"
                            onerror="this.src='https://i.gzcdn.net/images/member/noimg.gif';"
                            alt="${nickname}"
                        >
                        <div>
                            <div class="player-name">${nickname}</div>
                        </div>
                    </div>
                </td>
                <td>${gradeName ? gradeName.split(' ').join('<br>') : '-'}</td>
                <td>${ghandy !== null ? ghandy : '미정'}</td>
                <td>
                    <button class="remove-button" onclick="removeParticipant('${userNo}')">－</button>
                </td>
            `;
            
            tbody.appendChild(row);
            updateAddButtons();
            updateParticipantCount();
            updateParticipantHandicapStats();  // 참가자 평균 업데이트
        }

        function removeParticipant(userNo) {
            participants.delete(userNo);
            const row = document.querySelector(`tr[data-user-no="${userNo}"]`);
            if (row) {
                row.remove();
            }
            updateAddButtons();
            updateParticipantCount();
            updateParticipantHandicapStats();  // 참가자 평균 업데이트
        }

        function updateAddButtons() {
            const buttons = document.querySelectorAll('.add-button');
            buttons.forEach(button => {
                const userNo = button.getAttribute('data-user-no');
                button.disabled = participants.has(userNo);
                button.textContent = participants.has(userNo) ? '√' : '＋';
            });
        }

        async function displayRankings(rankings) {
            const tbody = document.getElementById('rankingsBody');
            tbody.innerHTML = '';
            const countElement = document.getElementById('totalMemberCount');
            let appendCount = 0;

            for (const player of rankings) {
                if (!player.dNickname) continue;

                const row = document.createElement('tr');
                const imgUrl = getNickImgByUsrNo(player.gUserNum);
                const gData = { 
                        ghandy: player.bHandy, 
                        nickName: player.gNickname,
                        gradeName: player.gGrade    //cvtGradeStr(player.gGrade)
                    }; //await fetchGolfzonUserData(player.golfzonNo);
                
                row.innerHTML = `
                    <td>
                        <div class="player-info">
                            <img 
                                src="${imgUrl}" 
                                class="player-image"
                                onerror="this.src='https://i.gzcdn.net/images/member/noimg.gif';"
                                alt="${player.dNickname}"
                            >
                            <div>
                                <div class="player-name">${player.dNickname}</div>
                                <div class="player-id">(${gData.nickName})</div>
                            </div>
                        </div>
                    </td>
                    <td>${gData.gradeName ? gData.gradeName.split(' ').join('<br>') : '-'}</td>
                    <td>${gData.ghandy !== null ? gData.ghandy : '미정'}</td>
                    <td>
                        <button 
                            class="add-button" 
                            data-user-no="${player.gUserNum}"
                            onclick="addParticipant('${player.dNickname}', '${gData.gradeName}', ${gData.ghandy}, '${player.gUserNum}')"
                        >+</button>
                    </td>
                `;
                tbody.appendChild(row);
                appendCount++;

                countElement.textContent = appendCount;
            }

            updateAddButtons();
            updateTotalHandicapStats();  // 전체 멤버 핸디 평균 업데이트
            updateGradeStats();  // 등급별 인원수 업데이트
        }

        async function fetchRankings() {
            // 이미 가져오기가 진행 중이면 중단
            if (isFetching) {
                alert('데이터를 가져오는 중입니다. 잠시만 기다려주세요.');
                return;
            }

            // const tournamentCode = document.getElementById('tournamentCode').value;
            // if (!tournamentCode) {
            //     alert('대회 코드를 입력해주세요.');
            //     return;
            // }

            const fetchButton = document.querySelector('.get-members-section button');
            try {
                // 가져오기 시작
                isFetching = true;
                fetchButton.disabled = true;
                fetchButton.textContent = '가져오는 중...';

                // API 엔드포인트 URL을 실제 사용하실 URL로 변경해주세요
                const response = await fetch(memberSheetUrl + '?action=memberList');
                const memberData = await response.json();

                if (!memberData) {
                    alert('데이터를 가져오는데 실패했습니다.');
                } else {
                    // 새 데이터를 가져오기 전에 기존 참가자 목록 초기화
                    participants.clear();
                    document.getElementById('participantsBody').innerHTML = '';
                    updateParticipantCount();
                    
                    await displayRankings(memberData);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('데이터를 가져오는데 실패했습니다.');
            } finally {
                // 가져오기 완료
                isFetching = false;
                fetchButton.disabled = false;
                fetchButton.textContent = '백스모 핸디 (골프존 G핸디 기반)';
            }
        }

        // ... 나머지 필요한 함수들 ...
        function calculateTeamStats(teams) {
            const teamSums = teams.map(
                team => team.reduce((sum, member) => sum + member.score, 0)
            );
            const average = teamSums.reduce((a, b) => a + b) / teamSums.length;
            const deviations = teamSums.map(sum => sum - average);
            const standardDeviation = Math.sqrt(
                deviations.reduce((sum, deviation) => sum + Math.pow(deviation, 2), 0) / teamSums.length
            );
            
            return { teamSums, deviations, deviationRange: standardDeviation * 2 };
        }

        function validateTeams(teams, membersPerTeam) {
            // teams.forEach((team, index) => {
            //     console.log(`팀 ${index + 1}: ${team.length}명`);
            // });
            return teams.every(team => team.length === membersPerTeam);
        }

        function createBalancedTeams(participantsList, numTeams) {
            const membersPerTeam = participantsList.length / numTeams;
            // let bestTeams = null;
            let top5BestTeams = [];
            let minDeviationRange = Infinity;
            let maxAttempts = 10000;  // 최대 시도 횟수
            
            // const maxDeviation = parseFloat(document.getElementById('maxDeviation').value);
            const distributeTopBottom = document.getElementById('distributeTopBottom').checked;

            // 멤버 생성 및 정렬
            const members = participantsList;

            // 상하위 1명씩 우선 배정 옵션이 선택된 경우
            if (distributeTopBottom) {
                members.sort((a, b) => b.score - a.score);
            }
         
            for (let attempt = 0; attempt < maxAttempts; attempt++) {
                const topGroup = members.slice(0, numTeams);
                const bottomGroup = members.slice(-numTeams);
                const remainingMembers = members.slice(numTeams, members.length - numTeams);

                // 각 팀당 최상위/최하위 1명씩 배정
                const teams = Array.from({length: numTeams}, () => []);

                // 각 라운드마다 다른 순서로 배정
                this.shuffleArray(topGroup);
                this.shuffleArray(bottomGroup);
                this.shuffleArray(remainingMembers);

                for (let i = 0; i < numTeams; i++) {
                    teams[i].push(topGroup[i]);     // 상위권 배정
                    teams[i].push(bottomGroup[i]);  // 하위권 배정
                }

                // 나머지 인원들을 순서대로 각 팀에 배정
                let teamIndex = 0;
                for (const member of remainingMembers) {
                    teams[teamIndex].push(member);
                    teamIndex = (teamIndex + 1) % numTeams;
                }

                // 팀 인원수 검증
                if (!this.validateTeams(teams, membersPerTeam)) {
                    continue;
                }

                // 현재 구성의 편차 범위 계산
                const { deviationRange } = this.calculateTeamStats(teams);
                //console.log(`시도 ${attempt + 1}의 편차 범위: ${deviationRange}`);

                // 더 좋은 구성을 찾았다면 저장
                // if (deviationRange < minDeviationRange) {
                    // minDeviationRange = deviationRange;
                    // bestTeams = teams.map(team => [...team]);
                // }

                // 팀 핸디 합계 기준으로 정렬
                teams.sort((a, b) => {
                    const sumA = a.reduce((sum, player) => sum + player.score, 0);
                    const sumB = b.reduce((sum, player) => sum + player.score, 0);
                    return sumA - sumB;
                });

                // 각 팀 내부를 score 기준으로 오름차순 정렬
                teams.forEach(team => {
                    team.sort((a, b) => a.score - b.score);
                });

                // 현재 팀 구성을 top5BestTeams에 추가 (중복 제거)
                const isDuplicate = top5BestTeams.some(existingTeam => {
                    // 팀 구성이 동일한지 확인
                    return existingTeam.teams.every((team, i) => {
                        return team.every((member, j) => member.name === teams[i][j].name);
                    });
                });

                if (!isDuplicate) {
                    // 현재 팀 구성의 편차 범위가 기존 상위 5개보다 작은 경우에만 추가
                    if (top5BestTeams.length < 5 || deviationRange < top5BestTeams[4].deviationRange) {
                        // 배열이 5개를 초과하면 마지막 요소 제거
                        if (top5BestTeams.length >= 5) {
                            top5BestTeams.pop();
                        }

                        top5BestTeams.push({
                            teams: teams.map(team => [...team]),
                            deviationRange: deviationRange
                        });

                        // 편차 범위가 작은 순으로 정렬
                        top5BestTeams.sort((a, b) => a.deviationRange - b.deviationRange);
                    }
                } else {
                    // console.log('중복');
                }

                // 충분히 좋은 밸런스를 찾았다면 중단
                // if (minDeviationRange <= maxDeviation) {  // 더 엄격한 편차 기준 적용
                //     break;
                // }

                // 상하위 1명씩 우선 배정 옵션이 선택된 경우
                if (!distributeTopBottom) {
                    this.shuffleArray(members);     // 멤버 순서 무작위로 섞기
                }
            }

            // 최종 결과 검증
            // if (!bestTeams || !this.validateTeams(bestTeams, membersPerTeam)) {
            //     // 마지막 시도: 기본 지그재그 배정
            //     bestTeams = Array.from({length: numTeams}, () => []);
            //     for (let i = 0; i < membersPerTeam; i++) {
            //         const startIdx = i * numTeams;
            //         const roundMembers = members.slice(startIdx, startIdx + numTeams);
            //         if (i % 2 === 0) {

            //         } else {
            //             roundMembers.forEach((member, j) => bestTeams[numTeams - 1 - j].push(member));
            //         }
            //     }
            // }

            //return bestTeams;
 
            // console.log(top5BestTeams.length);

            return top5BestTeams;
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;  // 편의를 위해 배열 반환
        }

                    const originalIndex1 = team.findIndex(m => m.name === member1.name && m.score === member1.score);
                    const originalIndex2 = member2 ? team.findIndex(m => m.name === member2.name && m.score === member2.score) : -1;
                    
                    membersHtml += `<span class="team-member" data-team="${index}" data-member="${originalIndex1}" style="cursor: pointer; color: #000000;">${member1.name} (${member1.score})</span>`;

                        selectedMember = this;
                        this.style.backgroundColor = '#ffeb3b';
                    } else {
                        // 두 번째 팀원 선택 - 교체 실행
                        const team1 = parseInt(selectedMember.dataset.team);
                        const team2 = parseInt(this.dataset.team);
                        const member1 = parseInt(selectedMember.dataset.member);
                        const member2 = parseInt(this.dataset.member);

                        // 팀원 교체
                        const temp = teams[team1][member1];
                        teams[team1][member1] = teams[team2][member2];
                        teams[team2][member2] = temp;

                        // 결과 다시 표시
                        document.querySelector('.result-section').innerHTML = '';
                        displayTeamResults(teams);

                        // 선택 초기화
                        selectedMember = null;
                    }
                });
            });

            // 편차 계산 및 표시
            const minSum = Math.min(...teamSums);
            const deviations = teamSums.map(sum => sum - minSum);
            
            deviationResults.innerHTML = '<div class="deviation-info"><h4>팀 별 편차</h4>';
            deviations.forEach((deviation, index) => {
                deviationResults.innerHTML += `<div style="margin-left: 17px;">${index + 1}번 팀 : ${deviation >= 0 ? '+ ' : ''}${deviation.toFixed(1)}</div>`;
            });
            
            // 표준편차 계산
            const average = teamSums.reduce((a, b) => a + b) / teamSums.length;
            const stdDev = Math.sqrt(teamSums.reduce((sum, x) => sum + Math.pow(x - average, 2), 0) / teamSums.length) * 2;
            deviationResults.innerHTML += `<div style="font-weight: bold;text-align: right;">표준 편차: ${stdDev.toFixed(2)}</div>`;
        }

            const teams = Array.from({ length: numTeams }, () => []);

                const teamIndex = index % numTeams;
                teams[teamIndex].push(participant);
            });

                const sumA = a.reduce((sum, player) => sum + player.score, 0);
                const sumB = b.reduce((sum, player) => sum + player.score, 0);
                return sumA - sumB;
            });

            return teams;
        }

        // 라이벌 팀 구성 함수
        function createRivalsTeams(participantsList, numTeams) {
            // 핸디가 비슷한 참가자끼리 팀에 배정
            const sortedParticipants = participantsList.sort((a, b) => a.score - b.score);
            const teams = Array.from({ length: numTeams }, () => []);
            const teamSize = Math.ceil(sortedParticipants.length / numTeams);

            for (let i = 0; i < teamSize; i++) {
                for (let j = 0; j < numTeams; j++) {
                    const participantIndex = i + j * teamSize;
                    if (participantIndex < sortedParticipants.length) {
                        teams[j].push(sortedParticipants[participantIndex]);
                    }
                }
            }

            return teams;
        }

                        // 그래프 데이터 추가
                        labels.push(grade);
                        data.push(gradeCounts[grade]);
                    }
                });
            
            // 그래프 업데이트
            const ctx = document.getElementById('gradeChart').getContext('2d');
            
            // 기존 차트가 있다면 제거
            if (window.gradeChart instanceof Chart) {
                window.gradeChart.destroy();
            }
            
            // 새 차트 생성
            window.gradeChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '등급별 인원수',
                        data: data,
                        // *** datalabel option 지정 
                        datalabels: {
                            display: true,
                            // align: "right",
                            // anchor: "end",
                            color: "#000000",
                            // borderWidth: 2,
                            // padding: {
                            //     bottom: 0,
                            //     left: 20,
                            // },
                        },
                        backgroundColor: backgroundColors.slice(0, labels.length),
                        borderColor: backgroundColors.slice(0, labels.length),
                        borderWidth: 1
                    }]
                },
                options: {
                    indexAxis: 'y',  // 가로 막대 그래프로 변경
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: {  // x축 설정 (이제 수직축)
                            beginAtZero: true,
                            ticks: {
                                stepSize: 1
                            }
                        },
                        y: {  // y축 설정 (이제 수평축)
                            ticks: {
                                font: {
                                    size: 12
                                }
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        }
                    }
                }
            });
        }

        function updateMemberSheet(button) {
            // const password = prompt("패스워드를 입력하세요:");

            // if (password !== "0100") {
            //     if (password !== null) { // 사용자가 취소 버튼을 누른 경우를 제외
            //         alert("패스워드가 올바르지 않습니다.");
            //     }
            //     return;
            // }

            button.textContent = '회원명부 갱신 중...';
            button.disabled = true;

            fetch(memberSheetUrl + '?action=updateMember')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.text();
                })
                .then(data => {
                    //alert('회원명부시트가 업데이트되었습니다.');
                    //console.log('Update success:', data);
                    button.textContent = '회원명부 갱신 완료';
                })
                .catch(error => {
                    //alert('회원명부시트 업데이트 중 오류가 발생했습니다.');
                    //console.error('There was a problem with the fetch operation:', error);
                    button.textContent = '회원명부 갱신 중 오류';
                })
                .finally(() => {
                    //button.textContent = '회원명부시트 업데이트';
                    button.disabled = false;
                });
        }

        (() => {
            const $ = id => document.getElementById(id);
            const canvas = $('lotteryCanvas'), ctx = canvas.getContext('2d');
            const W = canvas.width, C = W / 2, drumR = W / 2 - 5;
            const palette = ['#ff542b', '#a725bf', '#fa347d', '#267df5', '#17a978', '#f59e0b', '#0ea5e9', '#ef4444', '#8b5cf6', '#14b8a6'];
            let lottoParticipants = [], balls = [], winners = [], uploadedImages = [], mode = 'single', drawing = false, mixState = false, frame = 0, toastTimer = null, drawTimer = null;
            const rand = (a, b) => a + Math.random() * (b - a);
            class Ball {
                constructor(name, img, color) {
                    this.name = name; this.img = img || null; this.color = color || palette[Math.floor(Math.random() * palette.length)];
                    const scale = W / 380;
                    this.r = 24 * scale;
                    this.x = C + (Math.random() - .5) * 120 * scale;
                    this.y = C + (Math.random() - .5) * 120 * scale;
                    this.vx = (Math.random() - .5) * 10 * scale;
                    this.vy = (Math.random() - .5) * 10 * scale;
                }
                update() {
                    const scale = W / 380;
                    if (mixState) {
                        this.vx += (Math.random() - .5) * 6 * scale;
                        this.vy += (Math.random() - .5) * 6 * scale;
                        const speed = Math.hypot(this.vx, this.vy), maxSpeed = 24 * scale;
                        if (speed > maxSpeed) { this.vx = this.vx / speed * maxSpeed; this.vy = this.vy / speed * maxSpeed }
                    } else {
                        this.vx *= .95; this.vy *= .95;
                        this.vx += (Math.random() - .5) * .3 * scale;
                        this.vy += (Math.random() - .5) * .3 * scale;
                    }
                    this.x += this.vx; this.y += this.vy;
                    const dx = this.x - C, dy = this.y - C, dist = Math.hypot(dx, dy) || .001;
                    const limit = W / 2 - 12 * scale - this.r;
                    if (dist + this.r > W / 2 - 12 * scale) {
                        const nx = dx / dist, ny = dy / dist;
                        this.x = C + nx * limit; this.y = C + ny * limit;
                        const dot = this.vx * nx + this.vy * ny;
                        this.vx -= 2 * dot * nx; this.vy -= 2 * dot * ny;
                        this.vx *= .85; this.vy *= .85;
                    }
                }
                draw() {
                    ctx.save(); ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2); ctx.closePath(); ctx.clip();
                    if (this.img) { ctx.drawImage(this.img, this.x - this.r, this.y - this.r, this.r * 2, this.r * 2) }
                    else { ctx.fillStyle = this.color; ctx.fill() }
                    ctx.restore();
                    ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2); ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 2.8; ctx.stroke();
                    ctx.fillStyle = '#fff'; ctx.font = `bold ${11 * W / 380}px Pretendard,system-ui,sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.shadowColor = 'rgba(0,0,0,.8)'; ctx.shadowBlur = 4 * W / 380;
                    const label = this.name.length > 3 ? this.name.substring(0, 2) + '..' : this.name;
                    ctx.fillText(label, this.x, this.y); ctx.shadowBlur = 0;
                }
            }
            function imageForName(name) {
                const idx = lottoParticipants.indexOf(name);
                return idx >= 0 ? (uploadedImages[idx] || null) : null;
            }
            function makeBalls() {
                const names = lottoParticipants.filter(n => !winners.some(w => w.name === n));
                balls = names.map(name => new Ball(name, imageForName(name)));
            }
            function animate() {
                ctx.clearRect(0, 0, W, W);
                const bg = ctx.createRadialGradient(C, C, drumR * .1, C, C, drumR); bg.addColorStop(0, '#192943'); bg.addColorStop(1, '#0a1222'); ctx.fillStyle = bg; ctx.fillRect(0, 0, W, W);
                ctx.beginPath(); ctx.arc(C, C, drumR, 0, Math.PI * 2); ctx.strokeStyle = '#536176'; ctx.lineWidth = 8; ctx.stroke();
                ctx.beginPath(); ctx.arc(C, C, drumR - 13, 0, Math.PI * 2); ctx.strokeStyle = '#25344b'; ctx.lineWidth = 2; ctx.setLineDash([5, 8]); ctx.stroke(); ctx.setLineDash([]);
                for (let i = 0; i < balls.length; i++) {
                    for (let j = i + 1; j < balls.length; j++) {
                        const a = balls[i], b = balls[j];
                        const dx = b.x - a.x, dy = b.y - a.y, dist = Math.hypot(dx, dy);
                        const minDist = a.r + b.r;
                        if (dist < minDist && dist > 0.001) {
                            const overlap = minDist - dist, nx = dx / dist, ny = dy / dist;
                            a.x -= nx * overlap * .5; a.y -= ny * overlap * .5;
                            b.x += nx * overlap * .5; b.y += ny * overlap * .5;
                        }
                    }
                    balls[i].update(); balls[i].draw();
                }
                frame = requestAnimationFrame(animate);
            }
            function toast(msg) { $('toast').textContent = msg; $('toast').classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => $('toast').classList.remove('show'), 2300) }
            function updateStats() {
                $('totalCount').textContent = lottoParticipants.length; $('remainingCount').textContent = balls.length;
                $('winnerCount').textContent = winners.length; $('winnerCount2').textContent = winners.length;
                $('drawCount').max = Math.max(1, balls.length); if (+$('drawCount').value > +$('drawCount').max) $('drawCount').value = $('drawCount').max;
                $('drawCountLabel').textContent = $('drawCount').value;
            }
            function renderWinners() {
                const list = $('winnerList'); list.innerHTML = '';
                if (!winners.length) { list.innerHTML = '<div class="lotto-empty">아직 당첨자가 없어요. 행운의 주인공을 뽑아보세요!</div>'; return }
                winners.forEach((w, i) => {
                    const row = document.createElement('div'); row.className = 'lotto-winner';
                    const ball = document.createElement('div'); ball.className = 'lotto-winner-ball'; ball.style.backgroundColor = w.color;
                    if (w.img) ball.style.backgroundImage = `url("${w.img.src}")`; else ball.textContent = w.name.slice(0, 2);
                    const place = document.createElement('span'); place.className = 'lotto-place'; place.textContent = `${i + 1}등`;
                    const name = document.createElement('span'); name.className = 'lotto-name'; name.textContent = w.name;
                    row.append(ball, place, name); list.appendChild(row);
                });
            }
            function refresh() { updateStats(); renderWinners(); makeBalls() }
            function applyNames() {
                const names = [...new Set(lottoNames.split(/[,，、\n\r]+/).map(s => s.trim()).filter(Boolean))];
                if (!names.length) { toast('추첨할 이름을 입력해주세요.'); return }
                lottoParticipants = names; winners = []; makeBalls(); refresh();
                $('stageCaption').textContent = `${lottoParticipants.length}개의 공이 준비됐어요`;
                toast(`${lottoParticipants.length}명의 참가자를 적용했어요.`);
            }
            function setMode(next) {
                if (drawing) return; mode = next;
                $('singleMode').classList.toggle('active', mode === 'single'); $('batchMode').classList.toggle('active', mode === 'batch');
                $('batchSettings').style.display = mode === 'batch' ? 'block' : 'none'; $('singleHint').style.display = mode === 'single' ? 'flex' : 'none';
            }
            function showModal(w, title, desc) {
                $('modalSubTitle').textContent = title; $('popupName').textContent = w.name; $('popupDesc').textContent = desc || '행운의 주인공입니다!';
                const p = $('popupBall'); p.style.backgroundImage = w.img ? `url("${w.img.src}")` : 'none'; p.style.backgroundColor = w.color; p.textContent = w.img ? '' : w.name.slice(0, 2);
                $('modalOverlay').style.display = 'flex';
            }
            function closeModal() { $('modalOverlay').style.display = 'none' }
            function finishDraw() { drawing = false; mixState = false; $('drawBtn').disabled = false; $('drawBtn').textContent = '✦ ✨ 추첨하기'; $('stageCaption').textContent = '추첨 완료!'; refresh() }
            function startDrawing() {
                if (drawing) return;
                if (!balls.length) { toast(lottoParticipants.length ? '모든 참가자가 당첨됐어요. 초기화하거나 명단을 다시 적용하세요.' : '먼저 참가자 명단을 적용해주세요.'); return }
                drawing = true; $('drawBtn').disabled = true; $('drawBtn').textContent = '🎱 공을 섞는 중…'; mixState = true; $('stageCaption').textContent = '행운의 공을 섞고 있어요…';
                const count = mode === 'single' ? 1 : Math.min(Math.max(1, parseInt($('drawCount').value) || 1), balls.length);
                const started = performance.now();
                const initialMixMs = mode === 'batch' ? 2000 : 3000;
                function waitMix() {
                    if (performance.now() - started < initialMixMs) { drawTimer = setTimeout(waitMix, 50); return }
                    mixState = false;
                    if (mode === 'single') {
                        const idx = Math.floor(Math.random() * balls.length);
                        const w = balls[idx];
                        showModal(w, '🎉 개별 추첨 당첨자', `축하합니다! ${w.name}님이 당첨됐어요.`);
                        winners.push(w); refresh(); finishDraw();
                        $('modalOk').onclick = closeModal;
                    } else {
                        let i = 0, popupTimer = null, mixTimer = null, advancing = false;
                        function revealNext() {
                            if (i >= count) { closeModal(); finishDraw(); toast(`${count}명의 당첨자를 뽑았어요!`); return }
                            if (!balls.length) { closeModal(); finishDraw(); toast('남은 공이 없어 추첨을 마쳤어요.'); return }
                            const idx = Math.floor(Math.random() * balls.length);
                            const w = balls[idx];
                            i++;
                            showModal(w, `🎉 일괄 추첨 (${i}/${count})`, `축하합니다! ${w.name}님이 당첨됐어요.`);
                            winners.push(w); refresh();
                            advancing = false;
                            clearTimeout(popupTimer);
                            popupTimer = setTimeout(() => advance(), 1000);
                        }
                        function advance() {
                            if (advancing) return; advancing = true; clearTimeout(popupTimer); closeModal();
                            if (i >= count) { finishDraw(); toast(`${count}명의 당첨자를 뽑았어요!`); return }
                            mixState = true; $('stageCaption').textContent = '다음 당첨자를 위해 공을 섞고 있어요…';
                            mixTimer = setTimeout(() => { mixState = false; revealNext() }, 2000);
                        }
                        $('modalOk').onclick = advance;
                        revealNext();
                    }
                }
                waitMix();
            }
            async function importFromTeamParticipants() {
                if (drawing) return;
                const rows = document.querySelectorAll('#participantsBody tr');
                if (!rows.length) { toast('참가 맴버가 없습니다. 먼저 참가자를 추가해주세요.'); return }
                const names = [];
                const images = [];
                for (const row of rows) {
                    const name = row.querySelector('.player-name')?.textContent.trim();
                    if (!name) continue;
                    names.push(name);
                    const imgEl = row.querySelector('img.player-image');
                    if (imgEl && imgEl.src) {
                        const img = await new Promise(resolve => {
                            const loaded = new Image();
                            loaded.onload = () => resolve(loaded);
                            loaded.onerror = () => resolve(null);
                            loaded.src = imgEl.src;
                        });
                        images.push(img);
                    } else {
                        images.push(null);
                    }
                }
                lottoNames = names.join(', ');
                uploadedImages = images;
                applyNames();
            }
            $('singleMode').addEventListener('click', () => setMode('single')); $('batchMode').addEventListener('click', () => setMode('batch'));
            $('drawCount').addEventListener('input', () => $('drawCountLabel').textContent = $('drawCount').value);
            $('drawBtn').addEventListener('click', startDrawing);
            $('clearWinnersBtn').addEventListener('click', () => { if (drawing) return; winners = []; makeBalls(); refresh(); $('stageCaption').textContent = '당첨 결과를 지웠어요'; toast('당첨 결과를 지웠어요.') });
            $('importParticipantsBtn').addEventListener('click', importFromTeamParticipants);
            $('modalOk').addEventListener('click', closeModal);
            $('modalOverlay').addEventListener('click', e => { if (e.target === $('modalOverlay') && !drawing) closeModal() });
            applyNames(); setMode('single'); animate();
        })();

        function updateRankingSheet(button) {
            button.textContent = '상금랭킹 갱신 중...';
            button.disabled = true;

            fetch(memberSheetUrl + '?action=updateRanking')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.text();
                })
                .then(data => {
                    button.textContent = '상금랭킹 갱신 완료';
                })
                .catch(error => {
                    button.textContent = '상금랭킹 갱신 중 오류';
                })
                .finally(() => {
                    button.disabled = false;
                });
        }

    </script>

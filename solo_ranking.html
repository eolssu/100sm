<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>백스모 개인전 랭킹보드</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

		/*
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 0px 0px;
            background-image: url("https://i.imgur.com/wIf1rDe.jpeg");
            background-color: #00000050;
            background-position: center center;
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #f8f9ff;
        }
		*/

		/* 비디오를 전체 화면 배경으로 고정 */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
        }

        /* 모바일 화면 비율에 맞춰 동영상을 꽉 채우는 설정 */
        .video-background video {
            width: 100%;
            height: 100%;
            object-fit: cover; /* 가로세로 비율을 유지하며 화면을 꽉 채움 */
            object-position: center; /* 동영상의 중심을 화면 가운데로 맞춤 */
        }

        .board {
            width: 100%;
            border-radius: 24px;
            padding: 12px 8px 18px;
            position: relative;
            overflow: hidden;
        }

        .board::before {
            content: "";
            position: absolute;
            inset: -40%;
            background:
                radial-gradient(circle at 15% 5%, rgba(211, 255, 199, 0.2), transparent 56%),
                radial-gradient(circle at 85% 0%, rgba(255, 245, 178, 0.18), transparent 58%);
            opacity: 0.45;
            pointer-events: none;
        }

        .board-inner {
            position: relative;
            z-index: 1;
        }

        .board-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .title-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .title {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 0.02em;
            color: lavender;
        }

        .subtitle {
            font-size: 16px;
            color: #e34896;
        }

        .tag {
            padding: 8px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            background: linear-gradient(120deg, #ffb224, #ff5e5e);
            color: #1b1308;
            box-shadow: 0 0 18px rgba(255, 174, 0, 0.7);
        }

        /* ===== 동적 필터 버튼 영역 스타일 ===== */
        .filter-group {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            flex-wrap: wrap; /* 그룹이 많아질 경우 자동 줄바꿈 */
        }

        .filter-btn {
            flex: 1 1 auto;
            min-width: 60px;
            padding: 8px 14px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.3);
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .filter-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        .filter-btn.active {
			background: linear-gradient(135deg, #aecae0, #0064ff);
			border-color: #2196F3;
            color: #111;
            font-weight: 800;
            box-shadow: 0 0 12px rgba(255, 180, 50, 0.5);
        }
        /* ========================================= */

        .list-header {
            display: grid;
            grid-template-columns: 40px 1.2fr 1.3fr 0.6fr;
            padding: 6px 10px;
            font-size: 11px;
            color: rgba(205, 212, 245, 0.7);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .row {
            border-radius: 16px;
            padding: 0;
            min-height: 52px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.15s ease-out, box-shadow 0.15s ease-out, background 0.15s ease-out;
            position: relative;
            background: rgba(0, 0, 0, 0.20);
        }

        .row:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 18px rgba(0, 0, 0, 0.35);
            background: rgba(255, 255, 255, 0.11);
        }

        .row.top-1 {
            background: linear-gradient(135deg, #ffd70080, #ffc10700);
			transform: translateY(0);
			isolation: isolate;
        }

        .row.top-1::after {
            content: "";
            position: absolute;
            inset: -1px;
            border-radius: 16px;
            border: 1px solid rgba(255, 242, 176, 0.75);
            background: radial-gradient(circle at 10% 15%, rgba(255, 255, 255, 0.35), transparent 35%),
                        radial-gradient(circle at 85% 25%, rgba(255, 239, 173, 0.28), transparent 30%),
                        radial-gradient(circle at 30% 80%, rgba(255, 255, 255, 0.2), transparent 28%);
            pointer-events: none;
            z-index: 1;
            animation: championPulse 2.2s ease-in-out infinite;
        }

        .row.top-2 {
            background: linear-gradient(135deg, #a0a0a0eb, #9e9e9e00);
			transform: translateY(0);
        }

        .row.top-3 {
            background: linear-gradient(135deg, #c8894f, #ff8c5a00);
			transform: translateY(0);
        }

        @keyframes championPulse {
            0%, 100% {
                opacity: 0.8;
                box-shadow: inset 0 0 0 1px rgba(255, 250, 210, 0.3);
            }
            50% {
                opacity: 1;
                box-shadow:
                    inset 0 0 0 1px rgba(255, 250, 210, 0.55),
                    0 0 24px rgba(255, 218, 98, 0.45);
            }
        }

        .row-banner {
            width: 100%;
            height: 86px;
            background-image: url("");
            background-repeat: no-repeat;
            background-size: 100% 500%;
            position: relative;
        }

        .row-banner::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.20) 55%, rgba(0, 0, 0, 0.55));
            pointer-events: none;
        }

        .row-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 10px;
            z-index: 1;
            gap: 10px;
        }

        .overlay-left {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .overlay-right {
            display: flex;
            flex-direction: row;
            align-items: flex-end;
            gap: 0;
            flex: 0 0 auto;
        }

        .rank-badge {
            min-width: 26px;
            width: auto;
            height: 26px;
            padding: 0 5px;
            border-radius: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 11px;
            background: radial-gradient(circle at 30% 0%, #ffffff, #8BC34A);
			color: #3b2600;
			box-shadow: 0 0 0 2px #4CAF50;
            flex: 0 0 auto;
        }

		.row.top-1 .rank-badge {
            background: radial-gradient(circle at 30% 0%, #ffffff, #FFD700);
			color: #3b2600;
			box-shadow: 0 0 0 2px #FFC107, 0 0 30px rgba(150, 190, 255, 1);
        }

        .row.top-2 .rank-badge {
            background: radial-gradient(circle at 30% 0%, #ffffff, #C0C0C0);
			color: #101624;
			box-shadow: 0 0 0 2px #a0a0a0, 0 0 30px rgba(150, 190, 255, 1);
        }

        .row.top-3 .rank-badge {
            background: radial-gradient(circle at 30% 0%, #ffffff, #B87333);
			color: #2a1608;
			box-shadow: 0 0 0 2px rgb(188 130 74 / 90%), 0 0 26px rgba(255, 176, 110, 1);
        }

        .team-name {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 0.02em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .grade-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 24px;
            padding: 0;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 600;
            line-height: 1;
            letter-spacing: 0;
            border: 1px solid transparent;
            text-shadow: none;
            white-space: nowrap;
        }

        .grade-badge.grade-eagle {
            background: rgba(255, 193, 7, 0.2);
            color: #ffe07a;
            border-color: rgba(255, 205, 86, 0.6);
        }

        .grade-badge.grade-hawk {
            background: rgba(255, 111, 97, 0.2);
            color: #ffb0a7;
            border-color: rgba(255, 145, 132, 0.6);
        }

        .grade-badge.grade-crane {
            background: rgba(120, 220, 190, 0.18);
            color: #aef0df;
            border-color: rgba(133, 230, 200, 0.55);
        }

        .grade-badge.grade-magpie {
            background: rgba(153, 170, 255, 0.2);
            color: #c9d2ff;
            border-color: rgba(170, 184, 255, 0.6);
        }

        .grade-badge.grade-default {
            background: rgba(200, 210, 255, 0.12);
            color: rgba(225, 231, 255, 0.9);
            border-color: rgba(185, 197, 245, 0.35);
        }

        .team-score {
            font-weight: 700;
            font-size: 24px;
            text-align: right;
            color: #e6ff9f;
            text-shadow:
                0 0 10px rgba(179, 255, 109, 0.45),
                0 8px 20px rgba(0, 0, 0, 0.55);
        }

        .team-score span {
            font-size: 11px;
            opacity: 0.6;
            margin-left: 2px;
        }

        .members {
            margin-top: 52px;
            padding: 10px 12px 12px;
            display: none;
            font-size: 12px;
            color: rgba(225, 231, 255, 0.95);
            background: rgba(10, 12, 28, 0.45);
            border-top: 1px solid rgba(185, 197, 245, 0.18);
        }

        .row.open .members {
            display: block;
            overflow-x: auto;
        }

        .members-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            color: rgba(225, 231, 255, 0.95);
            table-layout: fixed;
        }

        .members-table th,
        .members-table td {
            padding: 7px 8px;
            border-bottom: 1px solid rgba(185, 197, 245, 0.18);
            white-space: nowrap;
        }

        .members-table th {
            font-weight: 650;
            font-size: 14px;
            color: rgba(195, 202, 255, 0.85);
            text-align: center;
            width: 25%;
        }

        .members-table td {
            text-align: center;
        }

        .footer {
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: rgba(200, 208, 245, 0.7);
        }

        .pill {
            padding: 2px 8px;
            border-radius: 999px;
            background: rgba(16, 20, 52, 0.9);
            border: 1px solid rgba(125, 134, 200, 0.6);
        }

        .row-banner,
        .team-sprite {
            display: none !important;
            background-image: none !important;
        }
    </style>
</head>
<body>
<!-- 1. MP4 비디오 배경 영역 (모바일 자동재생 최적화 설정) -->
<div class="video-background">
	<video autoplay muted playsinline poster="https://imgur.com">
		<source src="https://i.imgur.com/8NE760H.mp4" type="video/mp4">
		네 브라우저는 비디오 태그를 지원하지 않습니다.
	</video>
</div>

<!-- 
<video autoplay loop muted playsinline poster="https://imgur.com">
https://i.imgur.com/LHXP9Je.mp4
https://i.imgur.com/8NE760H.mp4
-->

<div class="board">
    <div class="board-inner">
        <div class="board-header">
            <div class="title-group">
                <div class="title" id="board-title">백스모 개인전 랭킹보드</div>
                <div class="subtitle" id="board-subtitle">어제의 나를 넘는자 왕좌에 오른다.</div>
            </div>
            <div class="tag" id="board-season">Season</div>
        </div>

        <!-- 동적으로 필터 버튼들이 생성될 컨테이너 -->
        <div class="filter-group" id="filter-group"></div>

        <ul class="list" id="ranking-list"></ul>

        <div class="footer">
            <span class="pill" id="total-score"></span>
            <span>클릭해서 상세 정보를 확인하세요</span>
        </div>
    </div>
</div>

<script>
    const rankingList = document.getElementById("ranking-list");
    const filterGroupContainer = document.getElementById("filter-group");
    
    let originalData = []; // 원본 데이터
    let currentFilter = "ALL"; // 현재 필터 상태

    async function loadSoloBattleData() {
        document.getElementById("total-score").textContent = "개인전 데이터를 불러오는 중입니다...";
        rankingList.innerHTML = `
            <li class="row">
                <div class="row-overlay">
                    <div class="overlay-left">
                        <div class="rank-badge">…</div>
                        <div class="team-name">로딩 중...</div>
                    </div>
                    <div class="overlay-right">
                        <div class="team-score">-</div>
                    </div>
                </div>
            </li>
        `;

        try {
            const res = await fetch("https://script.google.com/macros/s/AKfycbw5pJyBDnDT7JvRrBPlUKY1ILDTONyI0QFfu_MsBcXP1AQY0566v31Ur0ytAjTyw4iJTg/exec?action=soloBattleData");
            if (!res.ok) {
                throw new Error("API 응답 오류");
            }
            const payload = await res.json();
            originalData = Array.isArray(payload)
                ? payload
                : Array.isArray(payload?.data)
                    ? payload.data
                    : [];

            const seasonText = payload?.season;
            const titleText = payload?.title;
            if (typeof seasonText === "string" && seasonText.trim()) {
                document.getElementById("board-season").textContent = seasonText.trim();
            }
            if (typeof titleText === "string" && titleText.trim()) {
                document.getElementById("board-title").textContent = titleText.trim();
                //document.getElementById("board-subtitle").textContent = "어제의 나를 넘는자 왕좌에 오른다.";
            }

            // 1. 데이터에서 동적으로 group 목록 추출하여 필터 버튼 생성
            buildFilterButtons();

            // 2. 초기 리스트 렌더링
            renderList();

        } catch (e) {
            console.error(e);
            document.getElementById("total-score").textContent = "데이터를 불러오지 못했습니다.";
            rankingList.innerHTML = `<li class="row"><div class="row-overlay"><div class="overlay-left"><div class="team-name">데이터를 불러오지 못했습니다.</div></div></div></li>`;
        }
    }

    // 동적 그룹 필터 버튼 생성 함수
    function buildFilterButtons() {
        // 데이터 내 존재하는 unique한 group 값 취합 (빈 값 제외)
        const groups = Array.from(
            new Set(
                originalData
                    .map(item => item?.group ? String(item.group).trim() : "")
                    .filter(group => group !== "")
            )
        );

        // 필터 영역 초기화
        filterGroupContainer.innerHTML = "";

        // 그룹 데이터가 하나도 없거나, unique 그룹이 1개 이하일 경우 필터 숨김
        if (groups.length <= 1) {
            filterGroupContainer.style.display = "none";
            return;
        }

        filterGroupContainer.style.display = "flex";

        // '전체' 버튼 생성
        const allBtn = document.createElement("button");
        allBtn.className = "filter-btn active";
        allBtn.textContent = "전체";
        allBtn.addEventListener("click", () => setGroupFilter("ALL", allBtn));
        filterGroupContainer.appendChild(allBtn);

        // 동적 group 버튼들 생성
        groups.forEach(groupName => {
            const btn = document.createElement("button");
            btn.className = "filter-btn";
            btn.textContent = groupName;
            btn.addEventListener("click", () => setGroupFilter(groupName, btn));
            filterGroupContainer.appendChild(btn);
        });
    }

    // 그룹 필터 변경 이벤트 핸들러
    function setGroupFilter(group, btnElement) {
        currentFilter = group;
        
        // 버튼 active 클래스 토글
        const allBtns = filterGroupContainer.querySelectorAll('.filter-btn');
        allBtns.forEach(btn => btn.classList.remove('active'));
        if (btnElement) btnElement.classList.add('active');

        renderList();
    }

    // 리스트 렌더링 함수
    function renderList() {
        // 1. 동적 group 조건으로 필터링
        const filteredData = originalData.filter(item => {
            if (currentFilter === "ALL") return true;
            return String(item?.group ?? "").trim() === currentFilter;
        });

        // 2. 점수 오름차순 정렬, 동점이면 핸디 내림차순
        const sorted = [...filteredData].sort((a, b) => {
			// 부동 소수점 오차 이슈로 10을 곱하고 반올림하여 소수점을 완전히 제거 (예: 11.3 -> 113)
			const scoreA = Math.round(Number(a.score) * 10);
			const scoreB = Math.round(Number(b.score) * 10);
			const scoreDiff = scoreA - scoreB;
			if (scoreDiff !== 0) return scoreDiff;
            return Number(b.gHandy) - Number(a.gHandy);
        });

        // 3. 골프 순위 계산 (점수/핸디가 모두 같을 때 동일 등수)
        const golfRanks = [];
        let golfRank = 1;
        for (let i = 0; i < sorted.length; i++) {
            const prev = sorted[i - 1];
            const curr = sorted[i];
            const isSameScoreAndHandy = i > 0
                && Number(curr.score) === Number(prev.score)
                && Number(curr.gHandy) === Number(prev.gHandy);
            if (i > 0 && !isSameScoreAndHandy) {
                golfRank = i + 1;
            }
            golfRanks.push(golfRank);
        }

        // 동점 표기(T) 체크
        const isTiedAt = sorted.map((p, i) => {
            const score = Number(p.score);
            const handy = Number(p.gHandy);
            const prevSame = i > 0
                && Number(sorted[i - 1].score) === score
                && Number(sorted[i - 1].gHandy) === handy;
            const nextSame = i < sorted.length - 1
                && Number(sorted[i + 1].score) === score
                && Number(sorted[i + 1].gHandy) === handy;
            return prevSame || nextSame;
        });

        // 4. 평균/참가자수 하단 요약 계산
        const totalScore = sorted.reduce((sum, p) => sum + Number(p.score || 0), 0);
        const avgScore = sorted.length ? (totalScore / sorted.length) : 0;
        document.getElementById("total-score").textContent =
            `참가자 ${sorted.length}명 / 평균 ${avgScore.toFixed(1)}점`;

        // 5. DOM 출력
        rankingList.innerHTML = "";

        if (sorted.length === 0) {
            rankingList.innerHTML = `<li class="row"><div class="row-overlay"><div class="overlay-left"><div class="team-name">해당 조건의 참가자가 없습니다.</div></div></div></li>`;
            return;
        }

        sorted.forEach((player, index) => {
            const li = document.createElement("li");
            li.className = "row";

            if (index === 0) li.classList.add("top-1");
            else if (index === 1) li.classList.add("top-2");
            else if (index === 2) li.classList.add("top-3");

            const rankBadge = document.createElement("div");
            rankBadge.className = "rank-badge";
            rankBadge.textContent = isTiedAt[index]
                ? `T${golfRanks[index]}`
                : String(golfRanks[index]);

            const score = document.createElement("div");
            score.className = "team-score";
            const playerScore = Number(player?.score);
            const scoreText = Number.isFinite(playerScore)
                ? playerScore.toFixed(1)
                : "-";
            score.innerHTML = `${scoreText}<span>점</span>`;

            const overlay = document.createElement("div");
            overlay.className = "row-overlay";

            const overlayLeft = document.createElement("div");
            overlayLeft.className = "overlay-left";

            const name = document.createElement("div");
            name.className = "team-name";
            const carrotName = player?.carrotName ?? "-";
            const golfzonName = player?.golfzonName ?? "-";
            name.textContent = `${carrotName} (${golfzonName})`;

            const grade = String(player?.grade ?? "");
            let gradeEmoji = "참";
            const gradeBadge = document.createElement("div");
            gradeBadge.className = "grade-badge";
            if (grade.includes("독수리")) {
                gradeBadge.classList.add("grade-eagle");
                gradeEmoji = "독";
            } else if (grade.includes("매")) {
                gradeBadge.classList.add("grade-hawk");
                gradeEmoji = "매";
            } else if (grade.includes("학")) {
                gradeBadge.classList.add("grade-crane");
                gradeEmoji = "학";
            } else if (grade.includes("까치")) {
                gradeBadge.classList.add("grade-magpie");
                gradeEmoji = "까";
            } else {
                gradeBadge.classList.add("grade-default");
            }

            if (grade.includes("골드")) {
                gradeEmoji += "골";
            } else if (grade.includes("실버")) {
                gradeEmoji += "실";
            } else if (grade.includes("브론즈")) {
                gradeEmoji += "브";
            }

            gradeBadge.textContent = gradeEmoji;
            gradeBadge.title = grade || "등급";
            gradeBadge.setAttribute("aria-label", grade || "등급");

            overlayLeft.appendChild(rankBadge);
            overlayLeft.appendChild(name);
            overlayLeft.appendChild(gradeBadge);

            const overlayRight = document.createElement("div");
            overlayRight.className = "overlay-right";
            overlayRight.appendChild(score);

            overlay.appendChild(overlayLeft);
            overlay.appendChild(overlayRight);

            const membersBox = document.createElement("div");
            membersBox.className = "members";

            const formatNumber = (v) => {
                const isEmpty = v === null || v === undefined || v === "";
                if (isEmpty) return "-";
                const num = Number(v);
                if (!Number.isFinite(num)) return "-";
                return num.toLocaleString();
            };

            const formatSignedNumber = (v) => {
                const isEmpty = v === null || v === undefined || v === "";
                if (isEmpty) return "-";
                const num = Number(v);
                if (!Number.isFinite(num)) return "-";
                const sign = num > 0 ? "+" : "";
                return `${sign}${num.toLocaleString()}`;
            };

            const rawCcStroke = String(player?.ccStroke ?? "").trim();
            const hasCcStroke = rawCcStroke.length > 0;
            const ccParts = hasCcStroke
                ? rawCcStroke.split(",").map((part) => part.trim())
                : [];
            const ccStrokeRows = hasCcStroke
                ? `
                    <tr>
                        <th>A코스</th><td>${ccParts[0] || "-"}</td>
                        <th>B코스</th><td>${ccParts[1] || "-"}</td>
                    </tr>
                `
                : "";

            const details = document.createElement("table");
            details.className = "members-table";
            details.innerHTML = `
                <tbody>
                    <tr>
                        <th>스트로크</th><td>${formatSignedNumber(player?.stroke)}</td>
                        <th>라운드수</th><td>${formatNumber(player?.roundCount)}</td>
                    </tr>
                    <tr>
                        <th>대회전 핸디</th><td>${formatNumber(player?.gHandy)}</td>
                        <th>여성 보정치</th><td>${formatNumber(player?.gRevision)}</td>
                    </tr>
                    ${ccStrokeRows}
                </tbody>
            `;
            membersBox.appendChild(details);

            li.appendChild(overlay);
            li.appendChild(membersBox);

            li.addEventListener("click", () => {
                li.classList.toggle("open");
            });

            rankingList.appendChild(li);
        });
    }

    loadSoloBattleData();
</script>
</body>
</html>
